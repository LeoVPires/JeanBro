<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Rotina - FitBuilder</title>
    <link rel="stylesheet" href="../css/finish-routine.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <button id="back-btn" onclick="window.history.back()">← Voltar</button>
        <h1>Finalizar Rotina</h1>
        <p>Complete as informações para salvar sua rotina personalizada</p>
      </header>

      <main class="main-content">
        <form id="routineForm" class="routine-form">
          <!-- Nome do Treino -->
          <div class="form-group">
            <label for="routineName" class="form-label">
              Nome do Treino *
              <span class="char-counter" id="nameCounter">0/50</span>
            </label>
            <input
              type="text"
              id="routineName"
              name="routineName"
              maxlength="50"
              placeholder="Ex: Treino de Peito e Costas"
              class="form-input"
              required
            />
          </div>

          <!-- Dias da Semana -->
          <div class="form-group">
            <label class="form-label">Dias da Semana *</label>
            <div class="days-container" id="daysContainer">
              <button type="button" class="day-btn" data-day="0">Dom</button>
              <button type="button" class="day-btn" data-day="1">Seg</button>
              <button type="button" class="day-btn" data-day="2">Ter</button>
              <button type="button" class="day-btn" data-day="3">Qua</button>
              <button type="button" class="day-btn" data-day="4">Qui</button>
              <button type="button" class="day-btn" data-day="5">Sex</button>
              <button type="button" class="day-btn" data-day="6">Sáb</button>
            </div>
            <small class="form-hint">Clique para selecionar os dias</small>
          </div>

          <!-- Horário do Treino -->
          <div class="form-group">
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="hasSchedule"
                name="hasSchedule"
                class="checkbox"
              />
              <label for="hasSchedule" class="checkbox-label"
                >Definir horário para o treino</label
              >
            </div>

            <div class="time-input hidden" id="scheduleTimeContainer">
              <label for="scheduleTime" class="form-label"
                >Horário do Treino</label
              >
              <input
                type="time"
                id="scheduleTime"
                name="scheduleTime"
                class="form-input"
              />
            </div>
          </div>

          <!-- Notificações -->
          <div class="form-group">
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="enableNotifications"
                name="enableNotifications"
                class="checkbox"
              />
              <label for="enableNotifications" class="checkbox-label"
                >Receber notificações</label
              >
            </div>

            <div class="time-input hidden" id="notificationTimeContainer">
              <label for="notificationTime" class="form-label"
                >Horário da Notificação</label
              >
              <input
                type="time"
                id="notificationTime"
                name="notificationTime"
                class="form-input"
              />
            </div>
          </div>

          <!-- Notas Pessoais -->
          <div class="form-group">
            <label for="personalNotes" class="form-label">
              Notas e Observações
              <span class="char-counter" id="notesCounter">0/500</span>
            </label>
            <textarea
              id="personalNotes"
              name="personalNotes"
              maxlength="500"
              placeholder="Adicione observações sobre sua rotina, objetivos específicos, ou qualquer informação relevante..."
              class="form-textarea"
              rows="4"
            ></textarea>
          </div>
        </form>

        <!-- Resumo da Rotina -->
        <div class="routine-summary" id="routineSummary">
          <h3>Resumo da Rotina</h3>
          <div class="summary-content" id="summaryContent">
            <!-- O conteúdo será preenchido via JavaScript -->
          </div>
        </div>
      </main>

      <footer class="footer">
        <button type="button" id="backBtn" class="btn btn-secondary">
          Voltar
        </button>
        <button type="button" id="saveBtn" class="btn btn-primary">
          Salvar Rotina
        </button>
      </footer>
    </div>

    <!-- Modal de Confirmação -->
    <div id="successModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-icon">✓</div>
        <h3>Rotina Salva com Sucesso!</h3>
        <p>Sua rotina de treino foi criada e salva com sucesso.</p>
        <button id="modalCloseBtn" class="btn btn-primary">Continuar</button>
      </div>
    </div>

    <script type="module" src="../js/shared/stateManager.js"></script>
    <script type="module" src="../js/modules/finish-routine.js"></script>
  </body>
</html>
