<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurar Séries e Repetições</title>
    <link rel="stylesheet" href="../css/reps-config.css" />
  </head>
  <body>
    <div class="header">
      <button id="back-btn">← Voltar</button>
      <h1>Configurar Séries</h1>
      <button id="next-btn">Próximo →</button>
    </div>

    <div class="main">
      <div class="config-section">
        <form id="reps-config">
          <fieldset>
            <legend>Configurações do Treino</legend>

            <div class="form-group">
              <label for="reps-type">Tipo de execução:</label>
              <select name="reps-type" id="reps-type">
                <option value="sequential">Sequencial</option>
                <option value="alternated">Alternado</option>
              </select>
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="same-sets-for-all" checked />
                <span class="checkmark"></span>
                Usar mesmo número de séries para todos os exercícios
              </label>
            </div>

            <div class="form-group" id="global-sets-container">
              <label for="global-sets"
                >Número de séries para todos os exercícios:</label
              >
              <input
                type="number"
                id="global-sets"
                name="global-sets"
                min="1"
                max="20"
                value="3"
              />
            </div>
          </fieldset>
        </form>
      </div>

      <div class="exercises-section">
        <h2>Ordenar Exercícios</h2>
        <p class="drag-instruction">
          Arraste para ordenar a sequência dos exercícios
        </p>

        <div id="exercises-order" class="exercises-order">
          <!-- Os cards dos exercícios serão inseridos aqui via JavaScript -->
        </div>
      </div>
    </div>

    <script type="module" src="../js/shared/idbManager.js"></script>
    <script type="module" src="../js/shared/stateManager.js"></script>
    <script type="module" src="../js/modules/reps-config.js"></script>
  </body>
</html>
