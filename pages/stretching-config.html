<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/stretching-config.css" />
  </head>
  <body>
    <div class="header">
      <button id="back-btn" onclick="window.history.back()">← Voltar</button>
      <button id="next-btn">Próximo →</button>
    </div>
    <div class="container">
      <div class="formReps">
        <form id="selectionFormReps">
          <fieldset>
            <legend>
              Escolha como você quer atribuir um conjunto de alongamentos ao seu
              treino:
            </legend>
            <input type="radio" id="before" name="stretching" value="before" />
            <label for="before">Apenas antes do treino</label><br />

            <input type="radio" id="after" name="stretching" value="after" />
            <label for="after">Apenas depois do treino</label><br />

            <input
              type="radio"
              id="beforeAndAfter"
              name="stretching"
              value="beforeAndAfter"
            />
            <label for="beforeAndAfter">Antes e depois do treino</label><br />

            <input type="radio" id="none" name="stretching" value="none" />
            <label for="none">Nenhum</label><br />
          </fieldset>
        </form>
      </div>
      <div class="stretches">
        <div class="stretches-before hidden">
          <h3>Alongamentos antes dos exercícios:</h3>
          <div class="stretches-list" id="dynamic-stretches"></div>
        </div>
        <div class="stretches-after hidden">
          <h3>Alongamentos depois dos exercícios:</h3>
          <div class="stretches-list" id="static-stretches"></div>
        </div>
      </div>
    </div>
    <script type="module" src="../js/shared/idbManager.js"></script>
    <script type="module" src="../js/shared/stateManager.js"></script>
    <script type="module" src="../js/modules/stretching-config.js"></script>
  </body>
</html>
