<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="header">
      <button id="back-btn" onclick="window.history.back()">← Voltar</button>
      <button id="next-btn">Próximo →</button>
    </div>
    <div class="container">
      <div class="formReps">
        <form id="selectionFormReps">
          <fieldset>
            <legend>
              Escolha como você quer atribuir um conjunto de alongamentos ao seu
              treino:
            </legend>
            <input
              type="checkbox"
              id="before"
              name="streching"
              value="before"
              onclick="streatchingCheck(this)"
            />
            <label for="before">Apenas antes do treino</label><br />
            <input
              type="checkbox"
              id="beforeAndAfter"
              name="streching"
              value="beforeAndAfter"
              onclick="streatchingCheck(this)"
            />
            <label for="beforeAndAfter">Antes e depois do treino</label><br />
            <input
              type="checkbox"
              id="after"
              name="streching"
              value="after"
              onclick="streatchingCheck(this)"
            />
            <label for="after">Apenas depois do treino</label><br />
            <input
              type="checkbox"
              id="none"
              name="streching"
              value="none"
              onclick="streatchingCheck(this)"
            />
            <label for="none">Nenhum</label><br />
          </fieldset>
        </form>
      </div>
      <div class="streches"></div>
    </div>
  </body>
</html>
